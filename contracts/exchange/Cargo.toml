[package]
name = "swarmkit-exchange"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SwarmKit Exchange: sealed, bonded procurement rounds with on-chain split clearing and delivery-conditioned payout"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.7"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.7", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
